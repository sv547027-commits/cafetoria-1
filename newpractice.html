<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wanderly</title>
    <style>
        .main{
            height: 200px;
            width: 200px;
            border-radius: 20px;
            text-align: center;
            background: lightcoral;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .btn{
        }
        .btn button{
            background: blueviolet;
            border-radius: 10px;
            height: 50px;
            width: 100px;
            text-align: center;
            color: white;
            border: none;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover{
            background: darkcyan;
            transform: (1.05);
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="btn">
            <button>Read More </button>
        </div>
    </div>
</body>
</html>
